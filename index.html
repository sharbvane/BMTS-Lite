<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f7"><meta name="referrer" content="no-referrer"><title>BMTS Lite · 音乐一响，片就有了</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/glass.css"><script src="/app.js" defer></script></head>
<body><div class="ambient" aria-hidden="true"></div><header><a href="/" id="brand" aria-label="BMTS Lite 首页"><span class="logo" aria-hidden="true">▥</span> BMTS <span class="lite">Lite</span></a></header>
<main><section id="import-view" class="view"><div class="intro"><h1>音乐一响，<br class="mobile-break">片就有了。</h1></div>
<div class="ingredients"><button id="pick-video" class="import-tile" type="button"><span class="tile-icon" aria-hidden="true">▱</span><strong>导入视频</strong><span id="video-label">选择一段或多段素材</span><span id="thumbs" class="thumbs" aria-hidden="true"></span></button><span class="plus" aria-hidden="true">＋</span><button id="pick-audio" class="import-tile" type="button"><span class="tile-icon music" aria-hidden="true">♪</span><strong>导入音乐</strong><span id="audio-label">成片长度跟随整首音乐</span></button></div>
<input id="videos" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm,.mkv" multiple hidden><input id="music" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" hidden>
<div class="generate-row"><label for="ratio">画幅 <select id="ratio"><option value="auto">自动</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option><option>1:1</option><option>4:5</option></select></label><button id="generate" class="primary" disabled>生成混剪 <span aria-hidden="true">↗</span></button></div><div class="github-card"><span>BMTS Lite <small>获取后续更新</small></span><a href="https://github.com/sharbvane/bgm-montage" target="_blank" rel="noopener noreferrer">Star on GitHub ⭐</a></div></section>
<section id="progress-view" class="view progress-view" hidden aria-labelledby="progress-title"><div class="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h1 id="progress-title">正在跟上节奏。</h1><p id="phase" role="status" aria-live="polite">准备导入</p><progress id="progress" max="100" value="0" aria-label="当前阶段进度"></progress><div class="progress-detail"><span id="percent">0%</span><span id="elapsed">已用时 0:00</span></div></section>
<section id="result-view" class="view result-view" hidden><div class="result-heading"><div><p class="eyebrow">跟上了。</p><h1>你的节奏混剪。</h1></div><button id="new" class="plain">重新选素材 ↗</button></div><video id="player" controls playsinline preload="metadata" aria-label="混剪成片"></video><div class="result-actions"><span id="result-info"></span><div><button id="remix" class="secondary">再剪一版</button><button id="download" class="primary">保存视频 ↓</button></div></div></section>
<div id="error-box" role="alert" hidden><p id="error"></p><button id="retry" class="secondary">重试</button><button id="back" class="plain">返回导入</button></div></main><footer>BMTS Lite</footer>
<dialog id="export-dialog" aria-labelledby="export-title"><button class="dialog-close plain" id="close-export" aria-label="关闭导出弹窗">✕</button><div id="export-options"><h2 id="export-title">保存你的混剪</h2><p class="dialog-caption">选择清晰度</p><fieldset class="resolutions"><legend class="sr-only">导出清晰度</legend><label><input type="radio" name="resolution" value="480"><span>480p</span></label><label><input type="radio" name="resolution" value="720"><span>720p</span></label><label><input type="radio" name="resolution" value="1080" checked><span>1080p</span></label></fieldset><button id="confirm-export" class="primary">导出并保存 <span aria-hidden="true">↓</span></button></div><p id="export-status" role="status" aria-live="polite"></p><div id="export-success" hidden><svg class="success-check" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="m19 32 9 9 17-18"/></svg><h2 id="saved-title">视频已保存</h2><p id="saved-detail" class="dialog-caption"></p><div class="github-card success-github"><span>喜欢 BMTS Lite？<small>在 GitHub 收藏 ⭐ 项目，及时获取后续更新</small></span><a href="https://github.com/sharbvane/bgm-montage" target="_blank" rel="noopener noreferrer">Star on GitHub ⭐</a></div><button id="finish-export" class="secondary">完成</button></div></dialog></body></html>
